[package]
name = "godot-mcp"
version = "0.1.0"
edition = "2021"
description = "Godot project tools over MCP: run games, check scripts, run tests, import assets, export builds, and query the engine API."
license = "MIT"
repository = "https://github.com/Achilleees/godot-mcp-gdkit"

[[bin]]
name = "godot-mcp"
path = "src/main.rs"

[dependencies]
# Official MCP SDK. Pin the minor — the API breaks across majors (Content -> ContentBlock in 2.x).
rmcp = { version = "2.2", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "schemars"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "signal"] }
# WebSocket and binary data support.
tokio-tungstenite = "0.29"
futures-util = "0.3"
base64 = "0.22"
# Serde: schemars derives tool input schemas; serde_json is the bridge wire format.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# stderr-only structured logging (a stray stdout write corrupts JSON-RPC).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# HTTP transport (opt-in at runtime; see src/http.rs): rmcp's StreamableHttpService is a tower
# Service — axum owns the listener, routing, and the bearer-gate middleware around it.
axum = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
# Drives the axum router in-process (ServiceExt::oneshot) for the bearer-gate tests.
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
